name: Update External Examples

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update submodules
        run: git submodule update --remote --merge

      - name: Sync external examples
        run: |
          echo "🔄 Syncing external examples from submodule..."
          
          SUBMODULE_PATH=".submodules/stylus-sdk-rs/examples"
          EXTERNAL_PATH="example_code/external"
          
          # Remove existing external directory
          rm -rf "$EXTERNAL_PATH"
          mkdir -p "$EXTERNAL_PATH"
          
          # Copy all examples from submodule
          cp -r "$SUBMODULE_PATH"/* "$EXTERNAL_PATH/"
          
          # Fix all Cargo.toml files to use submodule path dependencies
          find "$EXTERNAL_PATH" -name "Cargo.toml" -type f | while read -r file; do
            echo "Processing: $file"
            
            # Fix path dependencies to point to our submodule (Linux sed syntax)
            sed -i \
              -e 's|stylus-sdk = { path = "[^"]*" }|stylus-sdk = { path = "../../../.submodules/stylus-sdk-rs/stylus-sdk" }|g' \
              -e 's|stylus-sdk = { path = "[^"]*", features = \([^}]*\) }|stylus-sdk = { path = "../../../.submodules/stylus-sdk-rs/stylus-sdk", features = \1 }|g' \
              -e 's|stylus-tools = { path = "[^"]*" }|stylus-tools = { path = "../../../.submodules/stylus-sdk-rs/stylus-tools" }|g' \
              -e 's|stylus-tools = { path = "[^"]*", features = \([^}]*\) }|stylus-tools = { path = "../../../.submodules/stylus-sdk-rs/stylus-tools", features = \1 }|g' \
              "$file"
          done
          
      - name: Build examples to ensure they work
        run: |
          echo "🔨 Testing build of external examples..."
          BUILD_SUCCESS=0
          BUILD_FAILURE=0
          
          for dir in example_code/external/*/; do
            if [ -d "$dir" ] && [ -f "$dir/Cargo.toml" ]; then
              folder_name=$(basename "$dir")
              echo "Building: $folder_name"
              
              cd "$dir"
              if cargo build > /dev/null 2>&1; then
                echo "✅ $folder_name: Build successful"
                BUILD_SUCCESS=$((BUILD_SUCCESS + 1))
              else
                echo "❌ $folder_name: Build failed"
                BUILD_FAILURE=$((BUILD_FAILURE + 1))
              fi
              cd - > /dev/null
            fi
          done
          
          echo "Build Summary: ✅ $BUILD_SUCCESS successful, ❌ $BUILD_FAILURE failed"
          
          # Continue even if some builds fail, but note in output
          if [ $BUILD_FAILURE -gt 0 ]; then
            echo "⚠️ Some examples failed to build but continuing with PR creation"
          fi
          
      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.verify-changed-files.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🤖 Auto-update external examples with submodule path dependencies"
          title: "Auto-update external examples"
          body: |
            ## 🤖 Automated External Examples Update
            
            This PR updates the external examples by copying the latest from stylus-sdk-rs and using submodule path dependencies.
            
            ### Changes:
            - 📋 Copied latest examples from stylus-sdk-rs submodule
            - 🔗 Updated path dependencies to use submodule for perfect compatibility
            - ✨ New examples or bug fixes may be included
            - 🔧 All examples use the exact same workspace as the original SDK
            
            ### Benefits:
            - ✅ Perfect version compatibility (no dependency conflicts)
            - ✅ All features work (including stylus-tools)
            - ✅ Future-proof (automatically compatible with SDK updates)
            
            **Please review the changes before merging.**
          branch: auto-update-examples
          delete-branch: true