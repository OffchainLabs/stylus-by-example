name: Update External Examples

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update submodules
        run: git submodule update --remote --merge

      - name: Sync external examples
        run: |
          echo "🔄 Syncing external examples from submodule..."
          
          SUBMODULE_PATH=".submodules/stylus-sdk-rs/examples"
          EXTERNAL_PATH="example_code/external"
          
          # Remove existing external directory
          rm -rf "$EXTERNAL_PATH"
          mkdir -p "$EXTERNAL_PATH"
          
          # Copy all examples from submodule
          cp -r "$SUBMODULE_PATH"/* "$EXTERNAL_PATH/"
          
          # Fix all Cargo.toml files
          find "$EXTERNAL_PATH" -name "Cargo.toml" -type f | while read -r file; do
            echo "Processing: $file"
            
            # Apply fixes (Linux sed syntax)
            sed -i \
              -e 's/stylus-sdk = { path = "[^"]*" }/stylus-sdk = "0.9.0"/g' \
              -e 's/stylus-sdk = { path = "[^"]*", features = \([^}]*\) }/stylus-sdk = { version = "0.9.0", features = \1 }/g' \
              -e 's/stylus-tools = { path = "[^"]*" }/stylus-tools = "0.2.0"/g' \
              -e 's/stylus-tools = { path = "[^"]*", features = \([^}]*\) }/stylus-tools = { version = "0.2.0", features = \1 }/g' \
              "$file"
          done
          
      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.verify-changed-files.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🤖 Auto-update external examples with fixed dependencies"
          title: "Auto-update external examples"
          body: |
            ## 🤖 Automated External Examples Update
            
            This PR updates the external examples by copying the latest from stylus-sdk-rs and fixing dependencies.
            
            ### Changes:
            - 📋 Copied latest examples from stylus-sdk-rs submodule
            - 🔧 Fixed path dependencies to use published crate versions
            - ✨ New examples or bug fixes may be included
            
            **Please review the changes before merging.**
          branch: auto-update-examples
          delete-branch: true