name: Update External Examples

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update submodules
        run: git submodule update --remote --merge

      - name: Fix Cargo.toml files
        run: |
          echo "Fixing Cargo.toml files..."
          find -L example_code/external -name "Cargo.toml" -type f | while read -r file; do
            echo "Processing: $file"
            
            # Replace path dependencies with version dependencies (updated to latest versions)
            sed -i \
              -e 's/stylus-sdk = { path = "[^"]*" }/stylus-sdk = "0.9.0"/g' \
              -e 's/stylus-sdk = { path = "[^"]*", features = \([^}]*\) }/stylus-sdk = { version = "0.9.0", features = \1 }/g' \
              -e 's/stylus-tools = { path = "[^"]*" }/stylus-tools = "0.2.0"/g' \
              -e 's/stylus-tools = { path = "[^"]*", features = \([^}]*\) }/stylus-tools = { version = "0.2.0", features = \1 }/g' \
              "$file"
          done
          
      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.verify-changed-files.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🤖 Auto-update external examples and fix Cargo.toml dependencies"
          title: "Auto-update external examples"
          body: |
            ## 🤖 Automated Submodule Update
            
            This PR updates the external examples from stylus-sdk-rs and fixes Cargo.toml dependencies.
            
            ### Changes:
            - Updated submodule to latest commit
            - Fixed path dependencies in Cargo.toml files to use published versions
            - New examples or bug fixes may be included
            
            **Please review the changes before merging.**
          branch: auto-update-examples
          delete-branch: true